<div id="cyber-wolf-wrap">
  <svg id="cyber-wolf" viewBox="0 0 140 140" width="120" height="120">
    <defs>
      <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="50%" stop-color="#334155"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.7"/></filter>
      <linearGradient id="snoutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
    </defs>
    <!-- Orejas -->
    <path d="M32,48 L22,12 L46,38 Z" fill="url(#furGrad)" filter="url(#shadow)"/>
    <path d="M108,48 L118,12 L94,38 Z" fill="url(#furGrad)" filter="url(#shadow)"/>
    <!-- Cráneo base -->
    <ellipse cx="70" cy="78" rx="36" ry="40" fill="url(#furGrad)" filter="url(#shadow)"/>
    <!-- Hocico/Perfil inferior -->
    <path d="M46,68 Q70,58 94,68 L86,106 Q70,116 54,106 Z" fill="url(#snoutGrad)"/>
    <!-- Ojos -->
    <g id="eye-l"><ellipse cx="54" cy="70" rx="9" ry="6" fill="#f59e0b" filter="url(#glow)"/><circle id="pupil-l" cx="54" cy="70" r="3.2" fill="#0f172a"/></g>
    <g id="eye-r"><ellipse cx="86" cy="70" rx="9" ry="6" fill="#f59e0b" filter="url(#glow)"/><circle id="pupil-r" cx="86" cy="70" r="3.2" fill="#0f172a"/></g>
    <!-- Nariz -->
    <path d="M63,99 L77,99 L70,109 Z" fill="#0f172a"/>
    <!-- Acentos cyber -->
    <line x1="70" y1="42" x2="70" y2="22" stroke="#22d3ee" stroke-width="1.5" opacity="0.7" stroke-dasharray="2 2"/>
    <circle cx="70" cy="22" r="3" fill="#22d3ee" opacity="0.9" filter="url(#glow)"/>
    <path d="M28,82 Q38,92 33,102" stroke="#475569" fill="none" stroke-width="1.5" opacity="0.6"/>
    <path d="M112,82 Q102,92 107,102" stroke="#475569" fill="none" stroke-width="1.5" opacity="0.6"/>
  </svg>
  <div id="wolf-terminal">>_ Iniciando módulo táctico...</div>
</div>

<style>
#cyber-wolf-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;cursor:pointer;user-select:none;transition:transform .25s}
#cyber-wolf-wrap:hover{transform:scale(1.04)}
#wolf-terminal{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:#0f172a;color:#94a3b8;font:11px/1.3 'Courier New',monospace;padding:5px 10px;border-radius:6px;border:1px solid #334155;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 0 10px rgba(34,211,238,.15)}
#wolf-terminal.show{opacity:1}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
#cyber-wolf{animation:breathe 3.5s infinite ease-in-out}
#cyber-wolf.scan #eye-l,#cyber-wolf.scan #eye-r{animation:scanPulse .8s infinite}
@keyframes scanPulse{0%,100%{fill:#22d3ee}50%{fill:#f59e0b}}
@media(max-width:600px){#cyber-wolf-wrap{bottom:12px;right:12px;width:95px;height:95px}#wolf-terminal{font-size:10px;top:-32px}}
</style>

<script>
(()=>{
  const wrap=document.getElementById('cyber-wolf-wrap'),
        svg=document.getElementById('cyber-wolf'),
        pL=document.getElementById('pupil-l'),
        pR=document.getElementById('pupil-r'),
        term=document.getElementById('wolf-terminal');
  const phrases=[
    "🔍 OSINT: Enumerando subdominios y metadatos...",
    "📡 SIGINT: Capturando tráfico puerto 443...",
    "🛡️ BlueTeam: Analizando logs AD (4624/4625)...",
    "🔓 RedTeam: Fuerza bruta SSH (Hydra)...",
    "📊 Threat Hunting: Correlación IOCs en SIEM...",
    "🔐 Hardening: Revisando GPO y permisos NTFS...",
    "🌐 Network: Escaneo stealth SYN (Nmap)...",
    "🐛 VulnAssess: Validando XSS/SQLi con ZAP...",
    "📦 DFIR: Análisis RAM con Volatility...",
    "🔗 ISO27001: Auditoría controles A.5.1/A.8.2...",
    "☁️ Cloud: Revisión roles IAM Azure AD...",
    "🧠 CyberChef: Decodificando Base64/Hex...",
    "🛠️ Scripting: Automatización Python/Bash...",
    "📡 DarkWeb: Monitorización filtraciones creds...",
    "🎯 C2 Sim: Traffic beaconing emulado...",
    "🔍 Forensics: Timeline Prefetch/AmCache...",
    "🛡️ EDR: Detección LOLBins y telemetría...",
    "🌐 DNS: Consulta inversa y detección DGA..."
  ];
  let idx=0, typing=false, scanActive=false;

  function typeText(str, el, cb){
    if(typing)return; typing=true;
    el.textContent=">_ "; let i=0;
    const iv=setInterval(()=>{
      el.textContent+=str[i]||""; i++;
      if(i>=str.length){clearInterval(iv);typing=false;if(cb)cb();}
    },22);
  }

  document.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=Math.min(2.5,Math.max(-2.5,(e.clientX-cx)/40)),
          dy=Math.min(2.5,Math.max(-2.5,(e.clientY-cy)/40));
    pL.setAttribute('transform',`translate(${dx},${dy})`);
    pR.setAttribute('transform',`translate(${dx},${dy})`);
  });

  wrap.addEventListener('click',()=>{
    if(scanActive||typing)return; scanActive=true;
    svg.classList.add('scan');
    term.classList.add('show');
    typeText(phrases[idx%phrases.length], term, ()=>{
      setTimeout(()=>{term.classList.remove('show');svg.classList.remove('scan');scanActive=false;},800);
    });
    idx++;
  });

  setInterval(()=>{
    if(!scanActive&&!typing){
      term.classList.add('show');
      term.textContent=">_ "+phrases[idx%phrases.length];
      setTimeout(()=>term.classList.remove('show'),3500);
      idx++;
    }
  },7000);
})();
</script>
