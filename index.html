<div id="cyber-wolf-ultimate">
  <div class="wolf-hud">
    <div class="hud-row">
      <div class="hud-metric" id="m-cpu"><span class="lbl">CPU</span><span class="val">00%</span><div class="bar"><div class="fill"></div></div></div>
      <div class="hud-metric" id="m-ram"><span class="lbl">MEM</span><span class="val">0.0G</span><div class="bar"><div class="fill"></div></div></div>
      <div class="hud-metric" id="m-net"><span class="lbl">NET</span><span class="val">---▲</span></div>
      <div class="hud-metric" id="m-sync"><span class="lbl">SYNC</span><span class="val">●●●</span></div>
    </div>
  </div>

  <svg id="wolf-svg" viewBox="0 0 340 340" width="190" height="190">
    <defs>
      <linearGradient id="wolfDark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a0f1a"/><stop offset="35%" stop-color="#151c2c"/><stop offset="70%" stop-color="#1e293b"/><stop offset="100%" stop-color="#050810"/>
      </linearGradient>
      <linearGradient id="wolfMid" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="wolfLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/>
      </linearGradient>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="65%">
        <stop offset="0%" stop-color="#00f0ff"/><stop offset="45%" stop-color="#00b4d8"/><stop offset="100%" stop-color="#005f73"/>
      </radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glowStrong"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.75"/></filter>
      <clipPath id="eyeClip"><ellipse rx="11" ry="7"/></clipPath>
    </defs>

    <!-- Anillos scanner dinámicos -->
    <circle cx="170" cy="170" r="155" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 10" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0 170 170" to="360 170 170" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="170" r="148" fill="none" stroke="#ff003c" stroke-width="0.6" stroke-dasharray="3 8" opacity="0.18">
      <animateTransform attributeName="transform" type="rotate" from="360 170 170" to="0 170 170" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- Orejas de lobo (erguidas, puntiagudas, anatómicas) -->
    <path d="M102,115 L82,48 L115,88 Z" fill="url(#wolfDark)" filter="url(#shadow)"/>
    <path d="M238,115 L258,48 L225,88 Z" fill="url(#wolfDark)" filter="url(#shadow)"/>
    <path d="M90,68 L96,56 L106,72" stroke="url(#wolfLight)" fill="none" stroke-width="1" opacity="0.6"/>
    <path d="M250,68 L244,56 L234,72" stroke="url(#wolfLight)" fill="none" stroke-width="1" opacity="0.6"/>
    <ellipse cx="102" cy="62" rx="6" ry="11" fill="#0a0f1a" opacity="0.5"/>
    <ellipse cx="238" cy="62" rx="6" ry="11" fill="#0a0f1a" opacity="0.5"/>

    <!-- Cabeza de lobo realista (forma triangular alargada) -->
    <path d="M115,105 C138,82 202,82 225,105 C248,128 242,172 208,205 C174,238 166,238 132,205 C98,172 92,128 115,105 Z" fill="url(#wolfDark)" filter="url(#shadow)"/>
    
    <!-- Marcas de pelaje en frente -->
    <path d="M145,118 Q170,132 195,118" stroke="url(#wolfMid)" fill="none" stroke-width="1.8" opacity="0.6"/>
    <path d="M132,132 Q170,148 208,132" stroke="url(#wolfMid)" fill="none" stroke-width="1.2" opacity="0.5"/>
    <path d="M155,108 L170,118 L185,108" stroke="url(#wolfLight)" fill="none" stroke-width="1" opacity="0.4"/>

    <!-- Hocico alargado característico de lobo -->
    <ellipse cx="170" cy="162" rx="46" ry="32" fill="url(#wolfMid)"/>
    <path d="M135,145 Q170,132 205,145 L200,185 Q170,200 140,185 Z" fill="url(#wolfDark)" opacity="0.75"/>
    <path d="M142,152 Q170,142 198,152" stroke="url(#wolfLight)" fill="none" stroke-width="1" opacity="0.4"/>

    <!-- Ojos de lobo (almendrados, penetrantes, posición lateral) -->
    <g id="eyeL" style="transform-origin: 132px 148px;">
      <ellipse cx="132" cy="148" rx="11" ry="7" fill="url(#eyeGlow)" filter="url(#glow)"/>
      <circle id="pupilL" cx="132" cy="148" r="4" fill="#050810" clip-path="url(#eyeClip)"/>
      <circle cx="134.5" cy="145.5" r="1.5" fill="#fff" opacity="0.9"/>
      <circle cx="130" cy="150" r="0.8" fill="#fff" opacity="0.5"/>
    </g>
    <g id="eyeR" style="transform-origin: 208px 148px;">
      <ellipse cx="208" cy="148" rx="11" ry="7" fill="url(#eyeGlow)" filter="url(#glow)"/>
      <circle id="pupilR" cx="208" cy="148" r="4" fill="#050810" clip-path="url(#eyeClip)"/>
      <circle cx="210.5" cy="145.5" r="1.5" fill="#fff" opacity="0.9"/>
      <circle cx="206" cy="150" r="0.8" fill="#fff" opacity="0.5"/>
    </g>

    <!-- Párpados para parpadeo -->
    <rect id="lidL" x="121" y="141" width="22" height="14" fill="url(#wolfDark)" opacity="0" rx="5"/>
    <rect id="lidR" x="197" y="141" width="22" height="14" fill="url(#wolfDark)" opacity="0" rx="5"/>

    <!-- Nariz negra de lobo -->
    <path d="M155,158 L185,158 L170,175 Z" fill="#050810"/>
    <ellipse cx="170" cy="164" rx="2.5" ry="1.5" fill="#fff" opacity="0.3"/>

    <!-- Boca y líneas de expresión -->
    <path d="M142,182 Q170,195 198,182" stroke="#151c2c" fill="none" stroke-width="1.2" opacity="0.6"/>
    <path d="M130,168 L125,180" stroke="url(#wolfLight)" fill="none" stroke-width="0.8" opacity="0.4"/>
    <path d="M210,168 L215,180" stroke="url(#wolfLight)" fill="none" stroke-width="0.8" opacity="0.4"/>

    <!-- Detalles de pelaje en cuello/mejillas -->
    <path d="M108,155 Q118,168 112,182" stroke="#475569" fill="none" stroke-width="1" opacity="0.45"/>
    <path d="M232,155 Q222,168 228,182" stroke="#475569" fill="none" stroke-width="1" opacity="0.45"/>
    <path d="M125,195 Q170,212 215,195" stroke="#334155" fill="none" stroke-width="1.4" opacity="0.35"/>

    <!-- Líneas cyberpunk integradas -->
    <g stroke="#00f0ff" stroke-width="1.2" fill="none" opacity="0.6" stroke-dasharray="2 5">
      <path d="M170,95 L170,48"><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></path>
      <path d="M148,122 L105,92"/>
      <path d="M192,122 L235,92"/>
      <path d="M122,168 L88,188" opacity="0.4"/>
      <path d="M218,168 L252,188" opacity="0.4"/>
    </g>
    <circle cx="170" cy="46" r="3.5" fill="#00f0ff" filter="url(#glowStrong)">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Efecto respiración sutil -->
    <ellipse cx="170" cy="155" rx="52" ry="56" fill="url(#wolfDark)" opacity="0.05">
      <animate attributeName="rx" values="52;55;52" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="56;59;56" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </svg>

  <div class="wolf-log">
    <div class="log-header"><span class="dot"></span> OPERATIONS FEED</div>
    <div class="log-content" id="log-out"></div>
  </div>
</div>

<!-- Toast notifications -->
<div id="toast-container"></div>

<canvas id="cyber-particles" style="position:fixed;inset:0;pointer-events:none;z-index:-1;"></canvas>

<style>
:root{--cyber:#00f0ff;--cyber2:#00b4d8;--warn:#ff003c;--ok:#bfff00;--bg:rgba(8,12,20,.94);--border:#1a2234;--text:#e2e8f0;--text2:#64748b;--mono:'JetBrains Mono','Courier New',monospace}
#cyber-wolf-ultimate{position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;align-items:flex-end;gap:10px;cursor:pointer;user-select:none;font-family:var(--mono);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.hud-row{display:flex;gap:10px;padding:6px 10px;background:rgba(12,18,30,.88);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.hud-metric{display:flex;flex-direction:column;gap:3px;width:44px}
.lbl{font-size:7px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;opacity:.85}
.val{font-size:9px;font-weight:700;color:var(--cyber);white-space:nowrap}
.bar{height:2px;background:#0f172a;border-radius:1px;overflow:hidden}
.fill{height:100%;width:0%;transition:width .35s cubic-bezier(.4,0,.2,1),background .3s}
#wolf-svg{transition:filter .3s,transform .3s;display:block}
#cyber-wolf-ultimate:hover #wolf-svg{transform:scale(1.05)}
#cyber-wolf-ultimate.active #wolf-svg{filter:drop-shadow(0 0 14px var(--cyber))}
#cyber-wolf-ultimate.focus #wolf-svg{filter:drop-shadow(0 0 12px var(--warn));animation:pulseWarn 1.2s infinite}
@keyframes pulseWarn{0%,100%{filter:drop-shadow(0 0 12px var(--warn))}50%{filter:drop-shadow(0 0 20px var(--warn))}}
#wolf-lidL,#wolf-lidR{transition:opacity .12s}
.wolf-log{width:310px;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;backdrop-filter:blur(16px);box-shadow:0 8px 26px rgba(0,0,0,.6)}
.log-header{display:flex;align-items:center;gap:6px;padding:7px 11px;font-size:8px;color:var(--text2);letter-spacing:.9px;border-bottom:1px solid var(--border)}
.log-header .dot{width:4px;height:4px;background:var(--cyber);border-radius:50%;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 5px var(--cyber)}50%{opacity:.25;box-shadow:none}}
.log-content{height:72px;padding:7px 11px;color:var(--text);font-size:9.5px;line-height:1.45;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.log-content div{opacity:0;transform:translateY(3px);transition:all .15s ease}
.log-content div.show{opacity:1;transform:translateY(0)}
.cmd{color:var(--cyber2)}.out{color:var(--text2)}.warn{color:var(--warn)}.ok{color:var(--ok)}.info{color:#60a5fa}
/* Toast notifications */
#toast-container{position:fixed;bottom:110px;right:24px;z-index:100000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--bg);border-left:3px solid var(--cyber);color:var(--text);padding:9px 13px;border-radius:7px;box-shadow:0 6px 22px rgba(0,0,0,.55);transform:translateX(180%);transition:transform .3s cubic-bezier(.4,0,.2,1);font-size:9px;max-width:300px;line-height:1.45;border:1px solid var(--border);backdrop-filter:blur(10px);animation:slideIn .3s ease}
.toast.show{transform:translateX(0)}
@keyframes slideIn{from{transform:translateX(180%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{border-color:var(--ok);border-left-width:3px}
.toast.warn{border-color:var(--warn);border-left-width:3px}
.toast.info{border-color:#60a5fa;border-left-width:3px}
.toast .title{font-weight:700;margin-bottom:2px;display:block}
.toast .desc{color:var(--text2);font-size:8.5px;opacity:.9}
@media(max-width:640px){#cyber-wolf-ultimate{bottom:12px;right:12px}#wolf-svg{width:135px;height:135px}.hud-row{gap:6px}.hud-metric{width:38px}.wolf-log{width:245px}.log-content{height:60px;font-size:8.5px}#toast-container{right:12px;bottom:95px;max-width:240px}.toast{max-width:240px}}
</style>

<script>
(()=>{
  if(!document.getElementById('cyber-wolf-ultimate')) return;
  
  const core=document.getElementById('cyber-wolf-ultimate'),
        svg=document.getElementById('wolf-svg'),
        pL=document.getElementById('pupilL'),pR=document.getElementById('pupilR'),
        lidL=document.getElementById('lidL'),lidR=document.getElementById('lidR'),
        log=document.getElementById('log-out'),
        mCpu=document.getElementById('m-cpu'),mRam=document.getElementById('m-ram'),
        mNet=document.getElementById('m-net'),mSync=document.getElementById('m-sync'),
        toastC=document.getElementById('toast-container'),
        canvas=document.getElementById('cyber-particles'),ctx=canvas.getContext('2d');

  function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
  resize();window.addEventListener('resize',resize);

  // Partículas dinámicas
  const pts=Array.from({length:45},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.4+.4,sx:(Math.random()-.5)*.4,sy:(Math.random()-.5)*.4,a:Math.random()*.4}));
  function drawPts(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p=>{
      p.x+=p.sx;p.y+=p.sy;p.a+=.012;
      if(p.x<0||p.x>canvas.width)p.sx*=-1;if(p.y<0||p.y>canvas.height)p.sy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,240,255,${Math.abs(Math.sin(p.a))*.65})`;ctx.fill();
    });
    requestAnimationFrame(drawPts);
  }
  drawPts();

  // Métricas en tiempo real
  let cpuHist=[],ramBase=performance.memory?performance.memory.usedJSHeapSize/1024/1024/1024:1.9;
  const nets=['443▲','80▲','22▲','8080▲','5432▲','9090▲','3306▲','6379▲'];
  let netI=0,turbo=false,turboT=null,opCounter=0;
  
  setInterval(()=>{
    try{
      const t0=performance.now();
      for(let i=0;i<2000;i++)Math.sqrt(i)*Math.random();
      const load=Math.min(98,Math.max(4,(performance.now()-t0)/2.5+Math.random()*15));
      cpuHist.push(load);if(cpuHist.length>8)cpuHist.shift();
      const avg=cpuHist.reduce((a,b)=>a+b)/cpuHist.length;
      const v=Math.round(avg).toString().padStart(2,'0')+'%';
      mCpu.querySelector('.val').textContent=v;
      mCpu.querySelector('.fill').style.width=`${avg}%`;
      mCpu.querySelector('.fill').style.background=avg>75?'var(--warn)':avg>45?'var(--ok)':'var(--cyber)';
    }catch{}
    try{
      if(performance.memory){
        const gb=(performance.memory.usedJSHeapSize/1024/1024/1024).toFixed(2);
        const lim=(performance.memory.jsHeapSizeLimit/1024/1024/1024).toFixed(1);
        const pct=(gb/lim)*100;
        mRam.querySelector('.val').textContent=gb+'G';
        mRam.querySelector('.fill').style.width=`${Math.min(100,pct)}%`;
      }else{
        ramBase+=((Math.random()-.4)*.18);if(Math.random()<.1)ramBase+=Math.random()*.5;
        ramBase=Math.max(1.2,Math.min(6.8,ramBase));
        mRam.querySelector('.val').textContent=ramBase.toFixed(2)+'G';
        mRam.querySelector('.fill').style.width=`${(ramBase/8)*100}%`;
      }
      mRam.querySelector('.fill').style.background='linear-gradient(90deg,var(--cyber),var(--ok))';
    }catch{}
    if(Math.random()<.3)netI=(netI+1)%nets.length;
    mNet.querySelector('.val').textContent=nets[netI];
    mSync.querySelector('.val').textContent=turbo?'◆◆◆':'●●●';
    mSync.querySelector('.val').style.color=turbo?'var(--warn)':'var(--cyber)';
  },turbo?280:450);

  // Eye tracking ultra-suave
  let tx=0,ty=0,cx=0,cy=0;
  document.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;});
  (function track(){
    const r=svg.getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height/2;
    cx+=(tx-cx)*0.038;cy+=(ty-cy)*0.038;
    const dx=Math.min(4.5,Math.max(-4.5,(cx-sx)/45)),dy=Math.min(4.5,Math.max(-4.5,(cy-sy)/45));
    pL.setAttribute('transform',`translate(${dx},${dy})`);
    pR.setAttribute('transform',`translate(${dx},${dy})`);
    requestAnimationFrame(track);
  })();

  // Toast notifications
  function toast(title,desc,type='ok'){
    const t=document.createElement('div');
    t.className=`toast ${type}`;
    t.innerHTML=`<span class="title">${title}</span><span class="desc">${desc}</span>`;
    toastC.appendChild(t);
    setTimeout(()=>t.classList.add('show'),10);
    setTimeout(()=>{
      t.classList.remove('show');
      setTimeout(()=>t.remove(),350);
    },3800);
  }

  // Log automático
  function logLine(html,type='out'){
    const d=document.createElement('div');
    d.className=type;d.innerHTML=`<span style="color:#475569">[${new Date().toLocaleTimeString('en-GB')}]</span> ${html}`;
    log.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'));
    if(log.children.length>5)log.removeChild(log.firstChild);
  }

  // Operaciones con notificaciones
  const operations=[
    {name:'NET_RECON',cmd:'nmap -sS -sV --min-rate 1500 10.12.0.0/24',notif:{title:'Recon complete',desc:'14 hosts identified // DC01.corp.local',type:'ok'}},
    {name:'ENUM_AD',cmd:'bloodhound-python -c All -d corp.local --zip',notif:{title:'BloodHound data ingested',desc:'1.8k nodes mapped // 3 paths to DA',type:'info'}},
    {name:'KERBEROAST',cmd:'python3 kerbute.py -u svc_backup --output hashes.txt',notif:{title:'Hash captured',desc:'NTLMv2 cracked // Password: Summer2024!',type:'warn'}},
    {name:'LATERAL',cmd:'mimikatz sekurlsa::logonpasswords',notif:{title:'Credentials dumped',desc:'DA session established // PTH success',type:'ok'}},
    {name:'WEB_SCAN',cmd:'subfinder -d target.io | httpx -silent',notif:{title:'Subdomains found',desc:'5 alive // api.target.io [403]',type:'info'}},
    {name:'VULN_SCAN',cmd:'nuclei -l alive.txt -t cves,exposures',notif:{title:'CVE detected',desc:'CVE-2024-XXXX // CVSS 9.1',type:'warn'}},
    {name:'SQLI',cmd:'sqlmap -u "search?q=1" --risk=3 --batch',notif:{title:'SQLi confirmed',desc:'PostgreSQL 14.2 // 42 tables',type:'warn'}},
    {name:'CLOUD_ENUM',cmd:'cloud_enum -k target --azure --brute',notif:{title:'Storage exposed',desc:'Blob leaked // SAS token valid',type:'warn'}},
    {name:'AZURE_ABUSE',cmd:'python3 azure_abuse.py --scope storage.write',notif:{title:'Token refreshed',desc:'Blob overwritten // config.bak',type:'ok'}},
    {name:'PERSISTENCE',cmd:'chisel client R:socks --auth zya',notif:{title:'SOCKS5 tunnel up',desc:'VNet access: 10.0.0.0/16',type:'info'}},
    {name:'REPORT',cmd:'cat findings.md | jq . // terraform plan',notif:{title:'Report generated',desc:'ISO 27001 compliant // IOCs exported',type:'ok'}},
    {name:'ALERT',cmd:'SIEM correlation // Sigma rules',notif:{title:'⚠️ IOC DETECTED',desc:'Lateral movement WSUS01→DC01',type:'warn'}}
  ];

  let opIdx=0,running=false,loopTimer=null;

  function runOp(){
    if(!running)return;
    const op=operations[opIdx%operations.length];
    opIdx++;
    opCounter++;
    
    // Velocidad variable pero rápida
    const baseSpeed=turbo?1.8:1;
    const delay=Math.floor((400+Math.random()*600)/baseSpeed);
    
    logLine(`<span class="cmd">$</span> ${op.cmd}`);
    
    setTimeout(()=>{
      logLine(`✅ <span class="ok">${op.name} complete</span>`);
      // Notificación toast aleatoria (60% probabilidad)
      if(Math.random()<0.65){
        toast(op.notif.title,op.notif.desc,op.notif.type);
      }
      // Alerta especial cada 4-6 operaciones
      if(opCounter%Math.floor(4+Math.random()*3)===0 && op.name!=='ALERT'){
        setTimeout(()=>{
          toast('⚠️ IOC DETECTED','Lateral movement pattern detected // Sigma: T1021.002','warn');
          core.classList.add('focus');
          setTimeout(()=>core.classList.remove('focus'),2000);
        },800);
      }
      
      // Siguiente operación con delay variable
      const nextDelay=Math.floor((600+Math.random()*800)/baseSpeed);
      setTimeout(runOp,nextDelay);
    },delay);
  }

  function start(){
    if(running)return;
    running=true;
    core.classList.add('active');
    logLine(`▶ <span class="info">System online // Auto-scan enabled</span>`);
    setTimeout(()=>toast('System initialized','Operations started // Real-time monitoring','info'),400);
    runOp();
  }
  
  start();
  
  // Auto-restart si se detiene
  setInterval(()=>{if(!running)start();},8000);

  // Click reaction
  core.addEventListener('click',()=>{
    if(turbo)return;
    turbo=true;
    // Parpadeo
    lidL.style.opacity='1';lidR.style.opacity='1';
    pL.setAttribute('r','1');pR.setAttribute('r','1');
    setTimeout(()=>{
      lidL.style.opacity='0';lidR.style.opacity='0';
      pL.setAttribute('r','4');pR.setAttribute('r','4');
    },280);
    // Pulso
    svg.style.transform='scale(1.1)';
    setTimeout(()=>svg.style.transform='',160);
    // Feedback
    toast('FOCUS MODE','Scan rate increased x2 // Priority targets','ok');
    logLine(`⚡ <span class="warn">Focus engaged // Turbo mode active</span>`);
    
    clearTimeout(turboT);
    turboT=setTimeout(()=>{
      turbo=false;
      core.classList.remove('focus');
      logLine(`⟲ <span class="info">Normal speed resumed</span>`);
    },2800);
  });

  // Init
  setTimeout(()=>{core.style.opacity='1';core.style.transform='translateY(0)';},100);
  window.addEventListener('beforeunload',()=>clearTimeout(turboT));
})();
</script>
